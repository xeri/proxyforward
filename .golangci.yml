# Curated on purpose. A linter that fails on day one teaches everyone to ignore
# CI, so this enables only checks the tree is clean against, and each exclusion
# below says why rather than hiding behind a default.
version: "2"

linters:
  default: none
  enable:
    - govet # already a CI gate; keep it inside the linter run too
    - staticcheck # real bug classes (SA*)
    - ineffassign # dead stores
    - unused # dead code
    - misspell # typos in comments, which are this repo's spec
    - errcheck # an ignored error is a silent failure; every site says so explicitly

  settings:
    errcheck:
      # No blanket (io.Closer).Close exclude: a write-path Close is the
      # last-bytes signal (a zip's central directory, a file's final flush), and
      # hiding it is how a corrupt support bundle got reported as written. Each
      # entry below is a type whose error is genuinely not actionable:
      exclude-functions:
        # Closing a socket: the peer is already gone or the FIN already sent by
        # relay's CloseWrite. Nothing a caller could do differs on the error.
        - (net.Conn).Close
        - (net.Listener).Close
        - (*net.TCPConn).Close
        - (*net.UDPConn).Close
        # An HTTP body closed after it has been read (or deliberately drained).
        - (io.ReadCloser).Close
        # Read-side database handles; the query's own error is the real signal.
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        # Diagnostic output. A failed write to stderr or into an archive entry
        # cannot be reported anywhere better than the thing that just failed.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Best-effort cleanup of a temp/quarantine path we are about to replace.
        - os.Remove
    staticcheck:
      # SA* = correctness. QF*/ST* = quickfix + style opinions: De Morgan's law,
      # tagged switches, dropping embedded-field selectors. This codebase's
      # comments are the spec and its explicitness is deliberate; those checks
      # would fight it for no correctness gain.
      checks: ["all", "-QF*", "-ST*"]
    misspell:
      # "alltime" is a Prometheus metric-name token (proxyforward_alltime_bytes_total).
      # Metric names cannot contain hyphens, so "all-time" is not a valid alternative.
      ignore-rules:
        - alltime

  exclusions:
    # No std-error-handling preset: its EXC0001 blanket-excludes every `.*Close`
    # from errcheck, which is exactly the class that hid a corrupt support bundle
    # being reported as written. The errcheck exclude-functions list above replaces
    # it, naming each type whose Close error is genuinely not actionable.
    rules:
      # Test code: an unchecked error in a test surfaces as the test failing, and
      # the noise would drown the production findings this linter exists for.
      - path: _test\.go
        linters: [errcheck]
